[package]
name = "shortwin-keeper-litesvm"
version = "0.1.0"
description = "TEST-ONLY: the keeper's in-process LiteSVM chain backend (invariant hooks on every keeper transaction) and its scenario tests on the mock venue and the Raydium fork"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
shortwin.workspace = true
shortwin-math.workspace = true
shortwin-services-common.workspace = true
shortwin-venue-state.workspace = true
# The mock venue's account lists (A49): only this test crate turns the feature on.
shortwin-keeper = { workspace = true, features = ["test-venue"] }
# The program-test harness (tests/litesvm): Env, the mock market builders, the invariant hooks.
shortwin-litesvm-tests = { path = "../../tests/litesvm" }
anchor-lang.workspace = true
anyhow.workspace = true
tokio.workspace = true
litesvm = "=0.16.0"
solana-account = "4.3"
solana-hash.workspace = true
solana-keypair.workspace = true
solana-message.workspace = true
solana-signature.workspace = true
solana-signer.workspace = true
solana-transaction.workspace = true
# The build digests of the M7 cost report (tests/bench/m7_keeper; already in this lockfile).
solana-sha256-hasher = "3"

[[test]]
name = "scenarios"
path = "tests/scenarios/main.rs"
