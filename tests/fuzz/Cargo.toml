[package]
name = "shortwin-fuzz"
version = "0.1.0"
description = "short.win invariant fuzz harness: seeded action sequences on LiteSVM 0.16 with the I1–I18 hooks after every instruction (ARCHITECTURE §8.3, §8.4; M7)"
edition = "2024"
# Host-only crate, as tests/litesvm (LiteSVM 0.16's MSRV).
rust-version = "1.89"
publish = false

# Lives in the ROOT workspace so it shares Cargo.lock and the LiteSVM 0.16.0 / Agave 4.2.2 line
# with tests/litesvm (C1-14). Every action goes through `shortwin_litesvm_tests::Env::send`, so the
# harness's hooks (I1–I13, I15–I19, A26 after every instruction and after every prefix of a
# multi-instruction transaction) are the fuzzer's invariants. No external crate is added: every
# dependency below is already in the lockfile.
[dependencies]
shortwin = { path = "../../programs/shortwin", features = ["no-entrypoint", "test-venue"] }
shortwin-math = { path = "../../crates/shortwin-math" }
shortwin-venue-state = { path = "../../crates/shortwin-venue-state" }
shortwin-litesvm-tests = { path = "../litesvm" }
anchor-lang = "=1.2.0"
litesvm = "=0.16.0"
serde_json = "1.0.151"
solana-account = "4.3"
solana-instruction = "~3.4"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-transaction-error = "~3.3.1"

[[bin]]
name = "shortwin-fuzz"
path = "src/main.rs"

[[test]]
name = "smoke"
path = "tests/smoke.rs"
