# T-CU-MATH (ARCHITECTURE §6.1, §8.1, §9 M0b): per-primitive compute-unit budgets of
# shortwin-math on SBF v3, measured with Mollusk. A standalone workspace with its own
# lockfile: the runner pulls Mollusk 0.15.1 and its Agave host crates, which must not enter
# the on-chain workspace's lockfile before M1 pins the Agave line LiteSVM and Mollusk share
# (ARCH §1.1, C1-14). See README.md.
[workspace]
resolver = "3"
members = ["program", "runner"]

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
