# M1 CU baseline (ARCHITECTURE §6.1, §8.2, §9 M1 exit criterion "CU baseline bench"): the
# compute units of every M1 instruction on the SBF program, measured with Mollusk 0.15.1 on
# account states built by the LiteSVM harness (tests/litesvm), which runs the same instruction
# as a cross-check. See README.md.
#
# A standalone workspace with its own lockfile, like tests/bench/cu_math: Mollusk stays out of
# the on-chain workspace's lockfile. The lockfile was seeded from the root Cargo.lock, so the
# shared crates (anchor 1.2.0, LiteSVM 0.16.0, the Agave 4.2.2 runtime line) resolve to the
# same versions as the program tests (C1-14).
[workspace]
resolver = "3"

[package]
name = "m1-cu-bench"
version = "0.1.0"
description = "short.win M1 CU baseline: every M1 instruction on Mollusk 0.15.1 (T-CU starts here)"
edition = "2024"
# Host-only crate; LiteSVM 0.16's MSRV.
rust-version = "1.89"
publish = false

[dependencies]
shortwin = { path = "../../../programs/shortwin", features = ["no-entrypoint"] }
shortwin-litesvm-tests = { path = "../../litesvm" }
shortwin-venue-state = { path = "../../../crates/shortwin-venue-state" }
anchor-lang = "=1.2.0"

# ARCH §1.1 pins.
litesvm = "=0.16.0"
mollusk-svm = "=0.15.1"

# The component crates both harnesses speak (the majors LiteSVM 0.16 declares).
solana-account = "4.3"
solana-clock = "~3.1.1"
solana-instruction = "~3.4"
solana-keypair = "3.1.2"
solana-rent = "~4.3"
solana-signer = "3.0.1"

# C1-14 (ARCH §1.1): Mollusk 0.15.1 declares the Agave runtime crates as ^4.2.0 and does not
# compile against 4.3.0; LiteSVM 0.16.0 declares ^4.2.1. Hold the line both share at 4.2.x
# (4.2.2 resolved, as in the root lockfile and tests/bench/cu_math).
agave-feature-set = "~4.2.2"
solana-bpf-loader-program = "~4.2.2"
solana-compute-budget = "~4.2.2"
solana-program-runtime = "~4.2.2"
solana-svm-callback = "~4.2.2"
solana-svm-feature-set = "~4.2.2"
solana-svm-log-collector = "~4.2.2"
solana-svm-timings = "~4.2.2"
solana-syscalls = "~4.2.2"
solana-system-program = "~4.2.2"
solana-transaction-context = "~4.2.2"
