# On-chain workspace (ARCHITECTURE §1.2). Host-only crates (keeper, indexer, Agave 4.3
# clients) live in services/ with their own lockfile and must never join this one.
# tests/litesvm is the exception ARCH §1.2 names: the program tests share this lockfile so the
# Agave line LiteSVM resolves is pinned next to the program's (C1-14); tests/fuzz (M7) links it
# and shares the lockfile for the same reason.
[workspace]
resolver = "3"
members = [
    "crates/shortwin-math",
    "crates/shortwin-math-wasm",
    "crates/shortwin-venue-state",
    # M10 WP-7: Squads v4 encoders for the governance tests (host-only; tests/litesvm links it).
    "crates/squads-v4-ix",
    "programs/shortwin",
    # (The stateless straddle helper programs/complete_curve, ARCH §5.4 A66, was retired with
    # pump's v3 exits: design pump-final §11, owner decision D2.)
    "tests/litesvm",
    # M7 invariant fuzz harness (ARCH §8.4): action sequences on LiteSVM through the I1–I18 hooks.
    "tests/fuzz",
    # TEST-ONLY venue program for M2 (A49); built by `anchor build`, never deployed.
    "tests/mock_cpamm",
]

# solana-verify picks its build image from this (ARCHITECTURE §1.1).
[workspace.metadata.cli]
solana = "4.1.2"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
