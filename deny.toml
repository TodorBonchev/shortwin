# cargo-deny 0.20 policy for the on-chain workspace (ARCHITECTURE §8.4 "Static").
# Run: cargo deny check

[graph]
all-features = false
no-default-features = false

[advisories]
# RustSec database; every advisory (vulnerability, unmaintained, unsound, yanked) fails.
unmaintained = "all"
yanked = "deny"
ignore = [
    # bincode 1.3.3 is unmaintained (not vulnerable) and comes in through anchor-lang 1.2.0
    # and solana-instruction; there is no upgrade path until Anchor drops it.
    { id = "RUSTSEC-2025-0141", reason = "bincode via anchor-lang 1.2.0; unmaintained, no advisory against 1.3.3's code" },
    # Unmaintained (not vulnerable) crates that enter only through the LiteSVM 0.16 test harness
    # (tests/litesvm: litesvm and the Agave 4.2.2 runtime crates, solana-syscalls ->
    # solana-poseidon -> ark-*); none is in the dependency graph of shortwin,
    # shortwin-math, shortwin-math-wasm or shortwin-venue-state (checked with `cargo tree -i`
    # at the M1 merge). Re-check when LiteSVM or the Agave line moves.
    { id = "RUSTSEC-2021-0139", reason = "ansi_term via litesvm 0.16 (test harness only)" },
    { id = "RUSTSEC-2024-0388", reason = "derivative via ark-* via solana-syscalls 4.2 (test harness only)" },
    { id = "RUSTSEC-2024-0436", reason = "paste via ark-ff via solana-syscalls 4.2 (test harness only)" },
    { id = "RUSTSEC-2025-0161", reason = "libsecp256k1 via solana-syscalls 4.2 (test harness only)" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# 0BSD (enum-iterator via solana-svm-timings) and BSD-2-Clause (arrayref via libsecp256k1 via
# solana-syscalls) enter only through the LiteSVM 0.16 test harness (tests/litesvm, M1); both
# are permissive. Nothing in the program's dependency graph uses them.

[licenses.private]
# Our own crates are `publish = false`; their licence (BUSL-1.1) is declared in REUSE.toml,
# not in Cargo.toml.
ignore = true

[bans]
# anchor-lang 1.2 pulls two majors of several solana-* component crates
# (solana-address 1/2, solana-pubkey 3/4, solana-instruction 3/4, ...): warn, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # web3.js-era and monolithic SDK crates must not enter the program (ARCHITECTURE §1.1, §2.1).
    { name = "solana-sdk" },
    { name = "solana-program", reason = "use the solana-* 3.x component crates that anchor-lang 1.2 brings" },
    { name = "pump-rust-client", reason = "ARCHITECTURE §2.1: never used; own readers in shortwin-venue-state" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
